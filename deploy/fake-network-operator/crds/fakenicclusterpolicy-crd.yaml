                description: |-
                  NicNodePools maps pool names to NIC topology configurations.
                  Each pool describes the simulated NIC hardware for nodes carrying the
                  corresponding pool label value.
                minProperties: 1
                type: object
              nodePoolSelector:
                default: fake-network-operator.io/nic-node-pool
                description: |-
                  NodePoolSelector is the label key used to assign nodes to NIC pools.
                  Defaults to "fake-network-operator.io/nic-node-pool"
                type: string
              secondaryNetworks:
                description: |-
                  SecondaryNetworks defines NetworkAttachmentDefinitions to generate.
                  Each entry produces a Multus NAD backed by a lightweight CNI delegate
                  (macvlan/bridge) instead of real hardware.
                items:
                  description: SecondaryNetworkSpec defines a NetworkAttachmentDefinition
                    to be generated.
                  properties:
                    ipamRange:
                      description: IPAMRange is the CIDR range for Whereabouts IPAM
                        (e.g., "192.168.2.0/24").
                      type: string
                    master:
                      default: eth0
                      description: Master interface on the host to attach to (for
                        macvlan/ipvlan).
                      type: string
                    name:
                      description: Name of the NetworkAttachmentDefinition to generate.
                      type: string
                    namespace:
                      default: default
                      description: Namespace to create the NAD in.
                      type: string
                    type:
                      description: 'Type is the CNI delegate plugin to use: "macvlan",
                        "ipvlan", "bridge".'
                      enum:
                      - macvlan
                      - ipvlan
                      - bridge
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
