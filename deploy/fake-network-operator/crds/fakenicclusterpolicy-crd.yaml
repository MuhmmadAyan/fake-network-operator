              nicNodePools:
                additionalProperties:
                  description: NicNodePoolSpec describes the simulated NIC topology
                    for a group of nodes.
                  properties:
                    gpuDirectCapable:
                      description: |-
                        GPUDirectCapable marks this pool as co-locatable with a fake GPU pool.
                        When true, the labeler will also set labels indicating GPUDirect readiness.
                      type: boolean
                    labels:
                      additionalProperties:
                        type: string
                      description: Labels are additional node labels to apply beyond
                        the standard set.
                      type: object
                    rdma:
                      description: RDMA configures default RDMA shared device settings for this pool.
                      properties:
                        resourceName:
                          type: string
                        sharedCount:
                          type: integer
                      type: object
                    sriov:
                      description: SRIOV configures default SR-IOV VF settings for this pool.
                      properties:
                        driver:
                          type: string
                        resourceName:
                          type: string
                        resourcePrefix:
                          type: string
                        totalVfs:
                          type: integer
