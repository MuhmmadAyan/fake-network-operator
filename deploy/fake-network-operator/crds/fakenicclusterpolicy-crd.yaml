                      description: NICs describes each simulated NIC on nodes in this
                        pool
                      items:
                        description: NicSpec describes a single simulated NIC.
                        properties:
                          boardID:
                            description: BoardID is the simulated board identifier
                            type: string
                          deviceID:
                            description: DeviceID is the PCI device ID (e.g., "101b"
                              for ConnectX-6, "1017" for ConnectX-5)
                            type: string
                          firmwareVersion:
                            default: 20.31.1014
