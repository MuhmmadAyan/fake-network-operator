                              driver:
                                default: mlx5_core
                                description: Driver is the simulated VF driver name
                                  (e.g., "mlx5_core").
                                type: string
                              resourceName:
                                description: ResourceName is the Kubernetes extended
                                  resource name (e.g., "hostdev").
                                pattern: ^[a-zA-Z0-9_]+$
                                type: string
                              resourcePrefix:
