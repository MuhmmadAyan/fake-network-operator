{{- range .Values.secondaryNetworks }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "fno.labels" $ | nindent 4 }}
spec:
  config: '{
      "cniVersion": "0.3.1",
      "name": "{{ .name }}",
      "type": "{{ .type }}"
    }'
{{- end }}
