{{- if .Values.components.admissionWebhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fno.fullname" . }}-admission-webhook
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "fno.labels" . | nindent 4 }}
    app: admission-webhook
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 9443
      protocol: TCP
      name: https
  selector:
    {{- include "fno.selectorLabels" . | nindent 4 }}
    app: admission-webhook
{{- end }}
