    image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
    command: ["python", "-c", "import torch; print('PyTorch initialized with simulated RDMA!')"]
    securityContext:
      capabilities:
        add: ["IPC_LOCK"]
    resources:
      limits:
        rdma/rdma_shared_device_a: "1"
        nvidia.com/hostdev: "1"
      requests:
        rdma/rdma_shared_device_a: "1"
        nvidia.com/hostdev: "1"
